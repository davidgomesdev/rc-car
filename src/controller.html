<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RC Car</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.5vh, 20px);
      padding: clamp(4px, 2vw, 16px);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    header { text-align: center; }
    h1 { font-size: 1.4em; letter-spacing: 4px; color: #0af; margin-bottom: 4px; }

    #status {
      font-size: 0.75em;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    #dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #f44;
      transition: background 0.3s;
    }
    #dot.ok { background: #3f3; }
    #status-text { color: #777; }

    #cam-status {
      font-size: 0.75em;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    #cam-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    #cam-dot.ok  { background: #3f3; }
    #cam-dot.err { background: #f44; }
    #cam-status-text { color: #777; }

    #gp-status {
      font-size: 0.75em;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    #gp-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    #gp-dot.ok  { background: #3f3; }
    #gp-dot.err { background: #f44; }
    #gp-status-text { color: #777; }

    .ip-row {
      width: 100%;
      max-width: 300px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ip-row label { font-size: 0.8em; color: #888; white-space: nowrap; }
    .ip-row input {
      flex: 1;
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.85em;
      padding: 5px 8px;
      outline: none;
    }
    .ip-row input:focus { border-color: #0af; }

    #camera-link { display: contents; }
    #camera {
      width: 100%;
      max-width: 480px;
      max-height: 28vh;
      aspect-ratio: 4/3;
      background: #111;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      object-fit: cover;
      display: block;
    }

    .speed-row {
      width: 100%;
      max-width: 300px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .speed-row label { font-size: 0.8em; color: #888; white-space: nowrap; }
    #speed-val { color: #0af; font-weight: bold; min-width: 38px; text-align: right; }
    #speed { flex: 1; accent-color: #0af; cursor: pointer; }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, clamp(64px, 18vw, 90px));
      grid-template-rows: repeat(3, clamp(64px, 18vw, 90px));
      gap: clamp(4px, 1.5vw, 10px);
    }

    .btn {
      background: #1c1c1c;
      border: 2px solid #2e2e2e;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2em, 5vw, 2em);
      cursor: pointer;
      transition: background 0.08s, border-color 0.08s, color 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn.empty { background: transparent; border: none; pointer-events: none; }
    .btn.active { background: #09202e; border-color: #0af; color: #0af; }
    #btn-stop { background: #1c0e0e; border-color: #3a1515; }
    #btn-stop.active { background: #2a0808; border-color: #f44; color: #f44; }

    .hint { font-size: 0.7em; color: #444; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>🚗 RC CAR</h1>
    <div id="cam-status">
      <div id="cam-dot"></div>
      <span id="cam-status-text">Camera off</span>
    </div>
    <div id="gp-status">
      <div id="gp-dot"></div>
      <span id="gp-status-text">No gamepad</span>
    </div>
  </header>

  <div class="ip-row">
    <label for="server-ip-input">Server IP</label>
    <input type="text" id="server-ip-input" placeholder="192.168.x.x" autocomplete="off" spellcheck="false">
  </div>

  <div class="ip-row">
    <label for="ip-input">Camera IP</label>
    <input type="text" id="ip-input" placeholder="192.168.x.x" autocomplete="off" spellcheck="false">
  </div>

  <a id="camera-link" href="#" target="_blank" rel="noopener">
    <img id="camera" alt="camera feed">
  </a>

  <div id="status">
    <div id="dot"></div>
    <span id="status-text">Connecting…</span>
  </div>

  <div class="speed-row">
    <label for="speed">Speed</label><input type="range" id="speed" min="10" max="100" value="75">
    <span id="speed-val">75%</span>
  </div>

  <!--
    Layout (+ pad):
      [ --- ]  [ ▲ F ]  [ --- ]
      [ ◀  L]  [ ■ S ]  [ ▶  R]
      [ --- ]  [ ▼ B ]  [ --- ]
    Hold a throttle (F/B) and a steer (L/R) together to arc.
    Left/Right alone spins in place.
  -->
  <div class="pad">
    <div class="btn empty"></div>
    <div class="btn" id="btn-f"  data-cmd="F">▲</div>
    <div class="btn empty"></div>
    <div class="btn" id="btn-l"  data-cmd="L">◀</div>
    <div class="btn" id="btn-stop" data-cmd="S">■</div>
    <div class="btn" id="btn-r"  data-cmd="R">▶</div>
    <div class="btn empty"></div>
    <div class="btn" id="btn-b"  data-cmd="B">▼</div>
    <div class="btn empty"></div>
  </div>

  <p class="hint">Throttle (▲▼) + steer (◀▶) together = arc · Steer alone = spin · Gamepad: L2/R2 + D-pad ◀▶</p>

  <script>
    const dot           = document.getElementById('dot');
    const statusText    = document.getElementById('status-text');
    const speedEl       = document.getElementById('speed');
    const speedValEl    = document.getElementById('speed-val');
    const ipInput       = document.getElementById('ip-input');
    const serverIpInput = document.getElementById('server-ip-input');
    const camImg        = document.getElementById('camera');
    const cameraLink    = document.getElementById('camera-link');
    const camDot     = document.getElementById('cam-dot');
    const camText    = document.getElementById('cam-status-text');

    let ws = null;
    let camStatusTimer = null;

    // ── Movement input state ──────────────────────────────────────────────
    // Throttle and steer are tracked independently, then combined into one
    // wire command by resolve(). Several input sources feed the held-input
    // sets below; the gamepad poll writes throttleDir/steerDir directly.
    let throttleDir = 0;             // -1 = back, 0 = none, +1 = forward
    let steerDir    = 0;             // -1 = left, 0 = none, +1 = right
    let gpSpeed     = null;          // gamepad trigger speed 0..100, or null
    let lastMsg     = null;          // last wire message sent, for de-dup
    const pressedBtns = new Set();   // on-screen buttons currently held
    const pressedKeys = new Set();   // arrow keys currently held

    // ── Gamepad support ───────────────────────────────────────────────────
    const gpDot      = document.getElementById('gp-dot');
    const gpText     = document.getElementById('gp-status-text');

    let gpIndex      = -1;           // index of active gamepad, -1 = none
    let gpRafId      = null;         // requestAnimationFrame handle

    function setGpStatus(connected) {
      gpDot.className  = connected ? 'ok' : '';
      gpText.textContent = connected ? 'Gamepad connected' : 'No gamepad';
    }

    function gpPoll() {
      const gp = navigator.getGamepads()[gpIndex];
      if (!gp || gp.buttons.length < 16) { gpRafId = requestAnimationFrame(gpPoll); return; }

      // Throttle from triggers (R2 = forward, takes priority over L2 = back).
      const r2 = gp.buttons[7].value;
      const l2 = gp.buttons[6].value;
      if      (r2 > 0) { throttleDir =  1; gpSpeed = Math.round(r2 * 100); }
      else if (l2 > 0) { throttleDir = -1; gpSpeed = Math.round(l2 * 100); }
      else             { throttleDir =  0; gpSpeed = null; }

      // Steer from D-pad left/right.
      if      (gp.buttons[14].pressed) steerDir = -1;
      else if (gp.buttons[15].pressed) steerDir =  1;
      else                             steerDir =  0;

      // Reflect the effective speed on the (disabled) slider for visibility.
      const spd = currentSpeed();
      speedEl.value          = spd;
      speedValEl.textContent = spd + '%';

      resolve();
      gpRafId = requestAnimationFrame(gpPoll);
    }

    function startGp(index) {
      gpIndex = index;
      lastMsg = null;
      setGpStatus(true);
      speedEl.disabled = true;
      if (gpRafId) cancelAnimationFrame(gpRafId);
      gpRafId = requestAnimationFrame(gpPoll);
    }

    function stopGp() {
      if (gpRafId) { cancelAnimationFrame(gpRafId); gpRafId = null; }
      gpIndex = -1;
      setGpStatus(false);
      speedEl.disabled = false;
      stopAll();
      resolve();   // sends 'S'
    }

    // ── Server IP (localStorage) ──────────────────────────────────────────
    const SERVER_STORAGE_KEY = 'rc_server_ip';

    serverIpInput.value = localStorage.getItem(SERVER_STORAGE_KEY) || '';

    serverIpInput.addEventListener('input', () => {
      localStorage.setItem(SERVER_STORAGE_KEY, serverIpInput.value.trim());
      if (ws) { ws.onclose = null; ws.close(); }
      connect();
    });

    // ── Camera IP (localStorage) ──────────────────────────────────────────
    const STORAGE_KEY = 'rc_camera_ip';

    function savedIp() {
      return localStorage.getItem(STORAGE_KEY) || '';
    }

    function applyIp(ip) {
      if (ip) {
        camImg.src       = 'http://' + ip + ':8080/video';
        cameraLink.href  = 'http://' + ip + ':8080';
      } else {
        camImg.src      = '';
        cameraLink.href = '#';
      }
      pollCameraStatus(ip);
    }

    ipInput.value = savedIp();
    applyIp(savedIp());

    ipInput.addEventListener('input', () => {
      const ip = ipInput.value.trim();
      localStorage.setItem(STORAGE_KEY, ip);
      applyIp(ip);
    });

    // ── Camera status polling ─────────────────────────────────────────────
    function setCamStatus(state) {
      // state: 'ok' | 'error' | 'off'
      camDot.className = state === 'ok' ? 'ok' : state === 'error' ? 'err' : '';
      camText.textContent = state === 'ok' ? 'Camera connected' : state === 'error' ? 'Camera error' : 'Camera off';
    }

    function pollCameraStatus(ip) {
      clearTimeout(camStatusTimer);
      if (!ip) { setCamStatus('off'); return; }

      fetch('/camerastatus?ip=' + encodeURIComponent(ip), { signal: AbortSignal.timeout(5000) })
        .then(r => {
          setCamStatus(r.ok ? 'ok' : 'error');
        })
        .catch(() => {
          setCamStatus('off');
        })
        .finally(() => {
          camStatusTimer = setTimeout(() => pollCameraStatus(ipInput.value.trim()), 5000);
        });
    }

    // ── Speed slider ──────────────────────────────────────────────────────
    speedEl.addEventListener('input', () => {
      speedValEl.textContent = speedEl.value + '%';
      recompute();   // live-update speed while a button/key is held
    });

    // ── WebSocket helpers ─────────────────────────────────────────────────
    function setStatus(ok, msg) {
      dot.className = ok ? 'ok' : '';
      statusText.textContent = msg;
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(msg);
    }

    function connect() {
      setStatus(false, 'Connecting…');
      const host = serverIpInput.value.trim() || location.host;
      ws = new WebSocket('ws://' + host + '/ws');
      ws.onopen  = () => setStatus(true, 'Connected');
      ws.onclose = () => {
        setStatus(false, 'Reconnecting…');
        stopAll();      // reset local input state (server stops motors on close)
        lastMsg = null;
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
    }

    // ── Command resolution ────────────────────────────────────────────────
    function currentSpeed() {
      return gpSpeed !== null ? gpSpeed : parseInt(speedEl.value, 10);
    }

    // Combine throttle + steer + speed into one wire command; send on change.
    function resolve() {
      const spd = currentSpeed();
      let msg;
      if (steerDir !== 0 && throttleDir === 0) {
        msg = (steerDir < 0 ? 'SL:' : 'SR:') + spd;        // spin in place
      } else if (steerDir !== 0) {
        const signed = throttleDir > 0 ? spd : -spd;       // arc (signed speed)
        msg = (steerDir < 0 ? 'L:' : 'R:') + signed;
      } else if (throttleDir !== 0) {
        msg = (throttleDir > 0 ? 'F:' : 'B:') + spd;       // straight
      } else {
        msg = 'S';
      }
      if (msg !== lastMsg) { send(msg); lastMsg = msg; }
      updateHighlights();
    }

    function updateHighlights() {
      document.querySelectorAll('.btn[data-cmd]').forEach(b => b.classList.remove('active'));
      const on = id => { const b = document.getElementById(id); if (b) b.classList.add('active'); };
      if (throttleDir > 0) on('btn-f'); else if (throttleDir < 0) on('btn-b');
      if (steerDir   < 0) on('btn-l'); else if (steerDir   > 0) on('btn-r');
    }

    // Recompute throttle/steer from held buttons + keys (non-gamepad input).
    function recompute() {
      if (gpIndex !== -1) return;        // gamepad is authoritative when connected
      const down = c => pressedBtns.has(c) || pressedKeys.has(c);
      throttleDir = down('F') ? 1 : down('B') ? -1 : 0;
      steerDir    = down('L') ? -1 : down('R') ? 1 : 0;
      resolve();
    }

    function stopAll() {
      pressedBtns.clear(); pressedKeys.clear();
      throttleDir = 0; steerDir = 0; gpSpeed = null;
    }

    // ── On-screen buttons (touch + mouse) ─────────────────────────────────
    function applyButton(cmd, pressed) {
      if (cmd === 'S') { if (pressed) { pressedBtns.clear(); pressedKeys.clear(); } }
      else if (pressed) pressedBtns.add(cmd);
      else pressedBtns.delete(cmd);
      recompute();
    }

    document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
      const cmd = btn.dataset.cmd;
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        applyButton(cmd, true);
      });
      btn.addEventListener('pointerup',     e => { e.preventDefault(); applyButton(cmd, false); });
      btn.addEventListener('pointercancel', ()  => applyButton(cmd, false));
    });

    // Safety: clear all input if the window loses focus.
    window.addEventListener('blur', () => { stopAll(); resolve(); });

    // ── Keyboard (arrow keys) ─────────────────────────────────────────────
    const KEY_TO_CMD = {
      ArrowUp: 'F', ArrowDown: 'B', ArrowLeft: 'L', ArrowRight: 'R'
    };

    document.addEventListener('keydown', e => {
      const cmd = KEY_TO_CMD[e.key];
      if (!cmd) return;
      e.preventDefault();
      if (pressedKeys.has(cmd)) return;  // ignore auto-repeat
      pressedKeys.add(cmd);
      recompute();
    });

    document.addEventListener('keyup', e => {
      const cmd = KEY_TO_CMD[e.key];
      if (!cmd) return;
      e.preventDefault();
      pressedKeys.delete(cmd);
      recompute();
    });

    // ── Gamepad connection/disconnection events ─────────────────────────────
    window.addEventListener('gamepadconnected', e => {
      if (gpIndex === -1) startGp(e.gamepad.index);
    });

    window.addEventListener('gamepaddisconnected', e => {
      if (e.gamepad.index !== gpIndex) return;
      // Try to find another connected gamepad
      const fallback = [...navigator.getGamepads()].findIndex(
        g => g && g.index !== e.gamepad.index
      );
      if (fallback !== -1) {
        startGp(fallback);
      } else {
        stopGp();
      }
    });

    connect();
  </script>
</body>
</html>
